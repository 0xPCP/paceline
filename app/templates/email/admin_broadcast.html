<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family:sans-serif;max-width:600px;margin:0 auto;padding:20px;color:#111827">
  <p style="color:#6b7280;font-size:.85rem;margin-bottom:4px">Platform Notice</p>
  <h2 style="margin:0 0 4px">{{ message.subject or 'Notice from Paceline' }}</h2>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:16px 0">
  <p style="white-space:pre-wrap;line-height:1.6">{{ message.body }}</p>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:16px 0">
  <p style="font-size:.75rem;color:#9ca3af">
    You're receiving this notice because you manage a club on Paceline.
  </p>
</body>
</html>
