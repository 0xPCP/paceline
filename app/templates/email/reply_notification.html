{% extends "email/_base.html" %}
{% block body %}
<div class="club-tag">{{ post.club.name }}</div>
<h1>{{ reply.author.username }} replied to your post</h1>

<div style="background:#f9fafb;border-radius:8px;padding:12px 16px;margin-bottom:12px;border:1px solid #e5e7eb">
  <p style="margin:0;font-size:.82rem;color:#9ca3af">Your post:</p>
  <p style="margin:4px 0 0;font-size:.9rem;color:#6b7280;white-space:pre-line">{{ post.body[:200] }}{% if post.body|length > 200 %}…{% endif %}</p>
</div>

<div style="background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:20px;border:1px solid #d1fae5">
  <p style="margin:0;font-size:.82rem;color:#059669;font-weight:600">{{ reply.author.username }} replied:</p>
  <p style="margin:6px 0 0;font-size:.95rem;color:#374151;white-space:pre-line">{{ reply.body }}</p>
</div>

<a href="https://paceline.club/clubs/{{ post.club.slug }}/board/" class="cta">View on Board</a>
{% endblock %}
