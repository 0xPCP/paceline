name: paceline
region: nyc

domains:
  - domain: paceline.club
    type: PRIMARY
  - domain: www.paceline.club
    type: ALIAS

services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: 0xPCP/paceline
      branch: master
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      failure_threshold: 3
    envs:
      # ── Non-sensitive runtime config ───────────────────────────────────────
      - key: COOKIE_SECURE
        value: "true"
        scope: RUN_TIME
      - key: SUPERADMIN_EMAILS
        value: "phil@pcp.dev"
        scope: RUN_TIME
      - key: MAIL_DEFAULT_SENDER
        value: "Paceline <noreply@paceline.club>"
        scope: RUN_TIME
      - key: EMAIL_PROVIDER
        value: "resend"
        scope: RUN_TIME
      - key: SPACES_BUCKET
        value: "paceline-media"
        scope: RUN_TIME
      - key: SPACES_REGION
        value: "nyc3"
        scope: RUN_TIME
      - key: SPACES_ENDPOINT
        value: "https://nyc3.digitaloceanspaces.com"
        scope: RUN_TIME
      - key: SPACES_PUBLIC_BASE_URL
        value: ""
        scope: RUN_TIME
      - key: BETA_PASSWORD
        value: "set-in-DO-console"
        scope: RUN_TIME

      # ── Secrets ────────────────────────────────────────────────────────────
      # IMPORTANT: Secrets are NOT listed here. Including a secret in this file
      # with any value (even a placeholder) will overwrite the live secret in
      # App Platform when `doctl apps update --spec` is run.
      #
      # Manage secrets exclusively via the DO console or the restore script:
      #   docs/restore_secrets.md
      #
      # Required secrets: DATABASE_URL, SECRET_KEY, RESEND_API_KEY,
      #   SPACES_ACCESS_KEY, SPACES_SECRET_KEY,
      #   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET
